# Generated per-bot config for the MCC MCP wrapper.
# Placeholders (__NICK__, __HOST__, __PORT__, __MCP_PORT__) are substituted at spawn time.
# Schema targets Minecraft Console Client v26.1.

[Main]
[Main.General]
Account = { Login = "__NICK__", Password = "-" }
Server = { Host = "__HOST__", Port = __PORT__ }
AccountType = "microsoft"
Method = "mcc"

[Logging]
DebugMessages = false
ChatMessages = true
SaveColorCodes = false

# Embedded MCP server: starts after the client joins the world, exposes Streamable HTTP at /mcp.
[ChatBot.McpServer]
Enabled = true

[ChatBot.McpServer.Transport]
BindHost = "127.0.0.1"
Port = __MCP_PORT__
Route = "/mcp"
RequireAuthToken = false

[ChatBot.McpServer.Capabilities]
SessionStatus = true
ChatAndCommands = true
Movement = true
Inventory = true
EntityWorld = true

[Main.Advanced]
MinecraftVersion = "1.21.11"
TerrainAndMovements = true
EntityHandling = true
InventoryHandling = true

[ChatBot.Pathfinder]
Enabled = true
Use_Terrain_Handling = true
