[project]
name = "mcc-fleet"
version = "0.1.0"
description = "MCP server that manages a fleet of Minecraft Console Client (MCC) instances and proxies their tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3.0",
]

[project.scripts]
mcc-wrapper = "mcc_wrapper.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcc_wrapper"]
